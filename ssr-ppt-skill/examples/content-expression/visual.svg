<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">两项申请：冷链时段改为共享池，跨城协助按 7∶3 分配</title>
  <desc id="desc">虚构配送公司区域分部的支持申请。现状：各门店单独分配冷链卸货时段，供应商分别预约，一处空置、一处排不上；建议改为区域共享时段池，供应商按实际送货量预约，单店每日上限不变。跨城订单由就近站点协助装卸，现状协助站点不参与运费分配；建议按发起 7、协助 3 分配，协助响应不超过 3 个工作日。同行甲公司约 18 个、乙公司约 10 个冷链时段，统计范围未说明，只作背景。</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9AA3AB"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F6690"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#F4F5F2"/>
  <g font-family="Microsoft YaHei, sans-serif" fill="#24292E">
    <text x="88" y="61" font-size="18" fill="#66707A">支持申请 / 虚构配送公司区域分部</text>
    <text x="1110" y="61" font-size="18" fill="#66707A">合成案例</text>
    <text x="88" y="138" font-size="38" font-weight="700">两项申请：冷链时段改为共享池，跨城协助按 7∶3 分配</text>
    <line x1="88" y1="172" x2="1192" y2="172" stroke="#C9CED3"/>

    <text x="88" y="218" font-size="22" font-weight="700" fill="#2F6690">① 冷链卸货时段</text>
    <text x="88" y="262" font-size="18" font-weight="700" fill="#66707A">现状 · 各店单独预约</text>
    <rect x="148" y="280" width="140" height="42" rx="4" fill="#E3E6E8"/>
    <text x="218" y="308" font-size="19" text-anchor="middle">供应商</text>
    <g stroke="#9AA3AB" stroke-width="1.5" marker-end="url(#gray)">
      <line x1="218" y1="322" x2="128" y2="378"/>
      <line x1="218" y1="322" x2="218" y2="378"/>
      <line x1="218" y1="322" x2="308" y2="378"/>
    </g>
    <rect x="90" y="380" width="76" height="40" fill="#FFFFFF" stroke="#9AA3AB" stroke-dasharray="4 3"/>
    <rect x="180" y="380" width="76" height="40" fill="#E3E6E8"/>
    <rect x="270" y="380" width="76" height="40" fill="#E3E6E8" stroke="#B5523B" stroke-width="1.5"/>
    <text x="128" y="406" font-size="17" text-anchor="middle" fill="#66707A">空置</text>
    <text x="218" y="406" font-size="17" text-anchor="middle">已约</text>
    <text x="308" y="406" font-size="17" text-anchor="middle" fill="#B5523B">排不上</text>
    <text x="128" y="446" font-size="17" text-anchor="middle">门店甲</text>
    <text x="218" y="446" font-size="17" text-anchor="middle">门店乙</text>
    <text x="308" y="446" font-size="17" text-anchor="middle">门店丙</text>
    <text x="88" y="490" font-size="17" fill="#66707A">分别预约：一处空置，一处排不上</text>

    <text x="400" y="262" font-size="18" font-weight="700" fill="#2F6690">建议 · 区域共享时段池</text>
    <rect x="460" y="280" width="140" height="42" rx="4" fill="#D6E4F0"/>
    <text x="530" y="308" font-size="19" text-anchor="middle">供应商</text>
    <g stroke="#2F6690" stroke-width="1.5" marker-end="url(#blue)">
      <line x1="530" y1="322" x2="530" y2="348"/>
      <line x1="530" y1="394" x2="450" y2="418"/>
      <line x1="530" y1="394" x2="530" y2="418"/>
      <line x1="530" y1="394" x2="610" y2="418"/>
    </g>
    <rect x="420" y="350" width="220" height="44" rx="4" fill="#2F6690"/>
    <text x="530" y="379" font-size="19" font-weight="700" text-anchor="middle" fill="#FFFFFF">共享时段池</text>
    <rect x="414" y="420" width="72" height="36" fill="#FFFFFF" stroke="#2F6690"/>
    <rect x="494" y="420" width="72" height="36" fill="#FFFFFF" stroke="#2F6690"/>
    <rect x="574" y="420" width="72" height="36" fill="#FFFFFF" stroke="#2F6690"/>
    <text x="450" y="444" font-size="17" text-anchor="middle">门店甲</text>
    <text x="530" y="444" font-size="17" text-anchor="middle">门店乙</text>
    <text x="610" y="444" font-size="17" text-anchor="middle">门店丙</text>
    <text x="400" y="490" font-size="17" fill="#2F6690">按实际送货量预约 · 单店每日上限不变</text>

    <line x1="710" y1="200" x2="710" y2="510" stroke="#C9CED3"/>

    <text x="740" y="218" font-size="22" font-weight="700" fill="#2F6690">② 跨城配送协作</text>
    <rect x="740" y="250" width="150" height="46" rx="4" fill="#D6E4F0"/>
    <rect x="1042" y="250" width="150" height="46" rx="4" fill="#D6E4F0"/>
    <text x="815" y="280" font-size="19" text-anchor="middle">发起站点</text>
    <text x="1117" y="280" font-size="19" text-anchor="middle">协助站点</text>
    <line x1="890" y1="273" x2="1040" y2="273" stroke="#2F6690" stroke-width="1.5" marker-end="url(#blue)"/>
    <text x="965" y="262" font-size="16" text-anchor="middle" fill="#2F6690">就近装卸</text>
    <text x="740" y="340" font-size="17" fill="#66707A">运费收入分配（建议）</text>
    <rect x="740" y="352" width="316.4" height="40" fill="#2F6690"/>
    <rect x="1056.4" y="352" width="135.6" height="40" fill="#D6E4F0"/>
    <text x="756" y="378" font-size="18" font-weight="700" fill="#FFFFFF">发起 7</text>
    <text x="1072" y="378" font-size="18" font-weight="700" fill="#2F6690">协助 3</text>
    <text x="740" y="418" font-size="16" fill="#66707A">现状：协助站点不参与分配</text>
    <text x="740" y="482" font-size="56" font-weight="700" fill="#2F6690">≤3</text>
    <text x="822" y="478" font-size="22">个工作日</text>
    <text x="740" y="510" font-size="16" fill="#66707A">协助响应时间（建议目标）</text>

    <rect x="88" y="548" width="1104" height="72" fill="#E9EBE6"/>
    <text x="110" y="577" font-size="18" font-weight="700">同行参考（口径不详）</text>
    <text x="110" y="605" font-size="17">甲公司约 18 个、乙公司约 10 个冷链时段，统计范围未说明；只作背景，不与本公司数据并列作图。</text>
    <text x="88" y="680" font-size="16" fill="#66707A">教学页面 · 全部为虚构材料；现状与建议分开标注，建议状态写在页面上。</text>
  </g>
</svg>
