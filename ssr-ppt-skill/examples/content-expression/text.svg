<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">已报名，仍需按时签到</title>
  <desc id="desc">虚构培训活动入场说明。收到成功邮件的本人凭二维码签到。7 月 12 日 13:30 至 14:00 签到，14:00 开始，14:15 未签到释放席位。不能参加请在 7 月 10 日 18:00 前取消；名额不可转让。候补由现场负责人按剩余席位安排，不保证入场。</desc>
  <rect width="1280" height="720" fill="#F8F5EF"/>
  <rect width="24" height="720" fill="#993D31"/>
  <g font-family="Microsoft YaHei, sans-serif" fill="#322C29">
    <text x="88" y="61" font-size="18" fill="#74645C">参与须知 / 已收到报名成功邮件的学员</text>
    <text x="88" y="153" font-size="48" font-weight="700">已报名，仍需按时签到</text>
    <line x1="88" y1="195" x2="1192" y2="195" stroke="#D7CCC2"/>
    <text x="88" y="266" font-size="26" fill="#993D31" font-weight="700">7 月 12 日</text>
    <text x="88" y="350" font-size="55" font-weight="700">13:30—14:00</text>
    <text x="88" y="397" font-size="25">签到时，请本人出示报名二维码。</text>
    <text x="88" y="453" font-size="24">14:00 活动开始。</text>
    <text x="88" y="499" font-size="24">14:15 仍未签到，席位将释放。</text>
    <line x1="731" y1="244" x2="731" y2="526" stroke="#D7CCC2"/>
    <text x="782" y="270" font-size="25" font-weight="700">如果不能参加</text>
    <text x="782" y="321" font-size="24">请在 7 月 10 日 18:00 前取消。</text>
    <text x="782" y="407" font-size="25" font-weight="700">名额不可转让</text>
    <text x="782" y="457" font-size="24">仅限报名成功的本人使用。</text>
    <rect x="88" y="565" width="1104" height="82" fill="#EEE5DA"/>
    <text x="110" y="599" font-size="21" font-weight="700">候补说明</text>
    <text x="110" y="629" font-size="21">由现场负责人按剩余席位安排，不保证入场。</text>
    <text x="88" y="689" font-size="16" fill="#74645C">教学页面 · 全部为虚构活动规则；保留条件文字，无须把每句话放进流程框。</text>
  </g>
</svg>
