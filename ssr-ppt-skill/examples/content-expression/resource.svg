<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">6 个时段已占用，剩余时段仍需审批</title>
  <desc id="desc">虚构实验室教学案例。同一仪器本周共有 7 个互不重叠的可预约时段，已占用 6 个，未分配 1 个。占用约 85.7%，未分配不等于立即可用。</desc>
  <rect width="1280" height="720" fill="#F5F2EA"/>
  <g font-family="Microsoft YaHei, sans-serif" fill="#232923">
    <text x="76" y="63" font-size="18" fill="#556057">LAB / 本周仪器预约</text>
    <text x="1110" y="63" font-size="18" fill="#556057">合成案例</text>
    <text x="76" y="153" font-size="44" font-weight="700">6 个时段已占用</text>
    <text x="76" y="211" font-size="44" font-weight="700">剩余时段仍需审批</text>
    <line x1="76" y1="254" x2="1204" y2="254" stroke="#C8CCC2"/>
    <text x="76" y="449" font-size="154" font-weight="700" fill="#265C43">6</text>
    <text x="195" y="446" font-size="60" fill="#556057">/ 7</text>
    <text x="82" y="509" font-size="26">个时段已占用</text>
    <text x="82" y="555" font-size="22" fill="#556057">约 85.7% · 同一周、同一台仪器</text>
    <line x1="609" y1="303" x2="609" y2="571" stroke="#C8CCC2"/>
    <text x="680" y="338" font-size="22" fill="#556057">未分配</text>
    <text x="677" y="437" font-size="86" font-weight="700">1</text>
    <text x="758" y="433" font-size="27">个时段</text>
    <rect x="680" y="478" width="524" height="92" fill="#E6EBDE"/>
    <text x="704" y="517" font-size="25" font-weight="700">尚不能视为立即可用</text>
    <text x="704" y="550" font-size="21">使用前仍须完成审批。</text>
    <line x1="76" y1="613" x2="1204" y2="613" stroke="#C8CCC2"/>
    <text x="76" y="654" font-size="18" fill="#556057">口径：7 个时段互不重叠；已占用 6 个属于其中。占用率 = 6 ÷ 7，保留一位小数。</text>
    <text x="76" y="686" font-size="16" fill="#556057">教学页面 · 全部为虚构数据；字体由查看环境提供，未包含字体文件。</text>
  </g>
</svg>
